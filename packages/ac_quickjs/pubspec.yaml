name: ac_quickjs
description: "A high-performance QuickJS JavaScript runtime for pure Dart and Flutter applications, ported from FJS."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  ffi: ^2.1.0
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
        sharedDarwinSource: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
        sharedDarwinSource: true
      windows:
        ffiPlugin: true
