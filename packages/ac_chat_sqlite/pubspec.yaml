name: ac_chat_sqlite
description: Offline-first SQLite cache layer for ac_chat. Pluggable channel interface supports Firebase, REST, WebSocket, or any remote backend.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.7.0

dependencies:
  ac_chat_core:
    path: './../ac_chat_core'
  ac_extensions:
    path: './../ac_extensions'
  ac_sql:
    path: './../ac_sql'
  ac_data_dictionary:
    path: './../ac_data_dictionary'
  autocode:
    path: './../autocode'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
