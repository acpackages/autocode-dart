name: ac_printing
description: Cross-platform printing and PDF document dispatch for pure Dart CLI, desktop, web, and mobile Flutter devices without external dependencies.
version: 1.0.0
publish_to: none
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.7.0

# Add regular dependencies here.
dependencies:
  autocode:
    path: './../autocode'
  ac_extensions:
    path: './../ac_extensions'
  ac_mirrors:
    path: './../ac_mirrors'
  pdf: ^3.13.1
  puppeteer: ^3.26.0
  ffi: ^2.2.0
  web: ^1.1.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        package: com.autocode.ac_printing
        pluginClass: AcPrintingPlugin
      ios:
        pluginClass: AcPrintingPlugin
