name: ac_widgets
description: High-performance Flutter UI widgets for AutoCode (DataGrid, Repeater, Pagination, Resizable, DataDictionary components, Popups).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  autocode:
    path: ../autocode
  ac_extensions:
    path: ../ac_extensions
  ac_data_dictionary:
    path: ../ac_data_dictionary
  ac_message:
    path: ../ac_message
  ac_quickjs:
    path: ../ac_quickjs
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
